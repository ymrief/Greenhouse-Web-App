# ==================== KONFIGURASI TARGET BACKEND (PRODUCTION/DOCKER) ====================
# GANTILAH alamat 'server ...' di bawah ini jika lokasi backend Anda berubah:
# - Jika backend berjalan di network Docker yang sama, gunakan nama containernya:
#     server greenhouse-backend:8000;
# - Jika backend berada di server/IP publik terpisah, gunakan IP & port target:
#     server 103.147.92.179:8002;
upstream backend_server {
    server greenhouse-backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve the built frontend assets
    location /greenhouse/website/ {
        alias /usr/share/nginx/html/greenhouse/website/;
        index index.html;
        try_files $uri $uri/ /greenhouse/website/index.html;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy control requests
    location /control/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy manual commands
    location /manual/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy auto sequence
    location /auto/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy sensor endpoint
    location /sensor {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket connections (real-time logs, sensor logs)
    location /ws/ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
